name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading 'v' (e.g. 0.4.0). Only used for manual dispatch."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mcpb CLI
        run: npm i -g @anthropic-ai/mcpb

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            # github.ref_name is e.g. "v0.4.0"; strip the leading "v".
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not resolve version from tag or input."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $version"

      - name: Verify manifest.json version matches tag
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw mcpb/manifest.json | ConvertFrom-Json
          if ($manifest.version -ne '${{ steps.ver.outputs.version }}') {
            throw "mcpb/manifest.json version ($($manifest.version)) does not match tag (${{ steps.ver.outputs.version }}). Bump the manifest before tagging."
          }

      - name: Build release artifacts (zip + mcpb)
        shell: pwsh
        run: pwsh tools/build-release.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Compute checksums
        id: hashes
        shell: pwsh
        run: |
          $zip  = "dist/ambient-context-mcp-${{ steps.ver.outputs.tag }}-win-x64.zip"
          $mcpb = "dist/ambient-context-mcp-${{ steps.ver.outputs.tag }}.mcpb"
          $zipHash  = (Get-FileHash $zip  -Algorithm SHA256).Hash.ToLowerInvariant()
          $mcpbHash = (Get-FileHash $mcpb -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip_sha256=$zipHash"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "mcpb_sha256=$mcpbHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "zip  sha256: $zipHash"
          Write-Host "mcpb sha256: $mcpbHash"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.tag }}
          path: |
            dist/ambient-context-mcp-${{ steps.ver.outputs.tag }}-win-x64.zip
            dist/ambient-context-mcp-${{ steps.ver.outputs.tag }}.mcpb

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $src = "docs/release-notes/v${{ steps.ver.outputs.version }}.md"
          if (-not (Test-Path $src)) {
            throw "Release notes not found: $src. Commit the file before tagging."
          }

          # Write to a separate path so re-runs (e.g. workflow_dispatch) stay
          # idempotent and the source file is never mutated.
          $dst = Join-Path $env:RUNNER_TEMP "release-notes-final.md"
          $body = Get-Content -Raw $src
          $body += "`n`n### Checksums`n`n"
          $body += "| File | SHA-256 |`n"
          $body += "|---|---|`n"
          $body += "| ambient-context-mcp-${{ steps.ver.outputs.tag }}-win-x64.zip | ``${{ steps.hashes.outputs.zip_sha256 }}`` |`n"
          $body += "| ambient-context-mcp-${{ steps.ver.outputs.tag }}.mcpb | ``${{ steps.hashes.outputs.mcpb_sha256 }}`` |`n"
          Set-Content -Path $dst -Value $body -NoNewline
          "path=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ steps.ver.outputs.tag }}' `
            --title 'Ambient Context MCP ${{ steps.ver.outputs.tag }}' `
            --notes-file '${{ steps.notes.outputs.path }}' `
            "dist/ambient-context-mcp-${{ steps.ver.outputs.tag }}-win-x64.zip" `
            "dist/ambient-context-mcp-${{ steps.ver.outputs.tag }}.mcpb"
